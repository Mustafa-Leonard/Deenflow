<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" fill="none">
  <defs>
    <linearGradient id="brandGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27a06d" />
      <stop offset="50%" style="stop-color:#1a8f5c" />
      <stop offset="100%" style="stop-color:#0d3d26" />
    </linearGradient>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d06f" />
      <stop offset="100%" style="stop-color:#d4a637" />
    </linearGradient>
  </defs>

  <!-- Brand mark: rounded tile with 8-point star + crescent -->
  <g transform="translate(4,4)">
    <rect width="88" height="88" rx="24" fill="url(#brandGradW)" />
    <rect x="8" y="8" width="72" height="72" rx="18" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
    <g transform="translate(44,44)">
      <rect x="-25" y="-7.5" width="50" height="15" rx="7.5" fill="url(#goldGradW)" opacity="0.95"/>
      <rect x="-25" y="-7.5" width="50" height="15" rx="7.5" fill="url(#goldGradW)" opacity="0.95" transform="rotate(90)"/>
      <circle r="11" fill="#0d3d26" opacity="0.9"/>
      <circle r="6.5" fill="url(#goldGradW)"/>
    </g>
    <path d="M 60 58 A 11 11 0 1 0 60 80 A 8.5 8.5 0 1 1 60 58 Z" fill="#ffffff" opacity="0.98"/>
  </g>

  <!-- Wordmark: DeenFlow -->
  <text x="106" y="52"
    font-family="'Poppins','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="40" font-weight="800" letter-spacing="-1"
    fill="#1B5E20">Deen</text>
  <text x="224" y="52"
    font-family="'Poppins','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="40" font-weight="700" letter-spacing="-1"
    fill="url(#brandGradW)">Flow</text>

  <!-- Tagline -->
  <text x="107" y="72"
    font-family="'Inter','Segoe UI',Arial,sans-serif"
    font-size="10.5" font-weight="600" letter-spacing="3"
    fill="#2E7D32" opacity="0.75">ISLAMIC GUIDANCE PLATFORM</text>
</svg>
