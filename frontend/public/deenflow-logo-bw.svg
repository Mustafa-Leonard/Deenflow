<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" fill="none">
  <!-- B&W version for print/light backgrounds -->

  <!-- Brand mark -->
  <g transform="translate(4,4)">
    <rect width="88" height="88" rx="24" fill="#1B5E20" />
    <rect x="8" y="8" width="72" height="72" rx="18" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <g transform="translate(44,44)">
      <rect x="-25" y="-7.5" width="50" height="15" rx="7.5" fill="#ffffff" opacity="0.95"/>
      <rect x="-25" y="-7.5" width="50" height="15" rx="7.5" fill="#ffffff" opacity="0.95" transform="rotate(90)"/>
      <circle r="11" fill="#1B5E20" opacity="0.9"/>
