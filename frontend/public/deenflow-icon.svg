<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27a06d" />
      <stop offset="50%" style="stop-color:#1a8f5c" />
      <stop offset="100%" style="stop-color:#0d3d26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d06f" />
      <stop offset="100%" style="stop-color:#d4a637" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square brand tile -->
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#brandGrad)" />

  <!-- Subtle inner ring -->
  <rect x="10" y="10" width="76" height="76" rx="19" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Modern 8-pointed Islamic star (Rub el Hizb) -->
  <g transform="translate(48,48)">
    <!-- Two overlapping squares form the 8-point star -->
    <rect x="-26" y="-8" width="52" height="16" rx="8" fill="url(#goldGrad)" opacity="0.95"/>
    <rect x="-26" y="-8" width="52" height="16" rx="8" fill="url(#goldGrad)" opacity="0.95" transform="rotate(90)"/>
    <!-- Inner star core -->
    <circle r="12" fill="#0d3d26" opacity="0.9"/>
    <circle r="7" fill="url(#goldGrad)"/>
  </g>

  <!-- Crescent moon overlapping the star lower-right -->
  <g transform="translate(63,63)">
    <path
      d="M 0 -12 A 12 12 0 1 0 0 12 A 9.5 9.5 0 1 1 0 -12 Z"
      fill="#ffffff"
      opacity="0.98"
      filter="url(#softGlow)"
    />
  </g>
</svg>
